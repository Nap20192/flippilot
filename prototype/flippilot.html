<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>FlipPilot</title>
<script id="fp-theme-init">(function(){try{document.documentElement.dataset.theme=localStorage.getItem('flippilot-theme')==='light'?'light':'dark';}catch(e){document.documentElement.dataset.theme='dark';}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--p:#141a23;--p2:#1a212c;--l:#263040;--t:#e7ebf1;--m:#8793a5;--b:#3b82f6;--g:#10b981;--a:#f59e0b;--r:#ef4444;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--t);background:var(--bg);font:14px/1.5 'Inter Tight',system-ui,sans-serif}
h1,h2,h3,.dsp{font-family:Sora,system-ui,sans-serif;margin:0;letter-spacing:-.02em}
a{color:inherit;text-decoration:none}
.app{display:flex;min-height:100vh}
aside{width:220px;background:var(--p);border-right:1px solid var(--l);padding:16px 10px;position:sticky;top:0;height:100vh;transition:width .2s;flex:none;overflow:hidden}
.c aside{width:62px}.c .lb{display:none}
.logo{display:flex;align-items:center;gap:10px;font:700 17px Sora;padding:4px 8px 18px;white-space:nowrap}
.mk{width:28px;height:28px;border-radius:8px;background:var(--b);display:grid;place-items:center;flex:none}
aside a,.tg{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;color:var(--m);margin-bottom:2px;background:none;border:0;width:100%;font:inherit;cursor:pointer;white-space:nowrap}
aside a:hover,.tg:hover{background:var(--p2);color:var(--t)}
aside a.on{background:#1d3257;color:#fff}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;min-width:0;padding:28px clamp(14px,3vw,36px)}
.hd{margin-bottom:20px}.hd p{color:var(--m);margin:4px 0 0}
.card{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:18px}
.grid{display:grid;gap:14px}.k4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.two{grid-template-columns:minmax(300px,2fr) 3fr;align-items:start}.eq{grid-template-columns:1fr 1fr}
.kpi b{display:block;font:700 26px Sora;margin-top:4px}.kpi span,.mu{color:var(--m);font-size:12.5px}
.btn{background:var(--p2);border:1px solid var(--l);color:var(--t);padding:8px 14px;border-radius:8px;font:600 13px 'Inter Tight';cursor:pointer;display:inline-block}
.btn:hover{border-color:var(--b)}.btn.p{background:var(--b);border-color:var(--b);color:#fff}
.chip{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid;white-space:nowrap}
.g{color:var(--g);background:#10b9811f;border-color:#10b98155}.a{color:var(--a);background:#f59e0b1f;border-color:#f59e0b55}.r{color:var(--r);background:#ef44441f;border-color:#ef444455}.b{color:var(--b);background:#3b82f61f;border-color:#3b82f655}
.cg{color:var(--g)}.cr{color:var(--r)}.ca{color:var(--a)}.cb{color:var(--b)}
label{display:block;color:var(--m);font-size:12px;margin-bottom:4px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--l);color:var(--t);border-radius:8px;padding:9px 10px;font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--b);outline-offset:1px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f .w{grid-column:1/-1}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}
th{color:var(--m);font-weight:500;text-align:left;font-size:12px}th,td{padding:9px 8px;border-bottom:1px solid var(--l)}td.n,th.n{text-align:right}
.demo{background:#f59e0b14;border:1px solid #f59e0b44;color:var(--a);border-radius:8px;padding:7px 12px;font-size:12.5px;margin-bottom:16px}
.bar{height:8px;border-radius:4px;background:var(--l);overflow:hidden;display:flex}.bar i{display:block;height:100%}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--l)}
.big{font:700 34px Sora}.tabs{display:flex;gap:8px;flex-wrap:wrap}
#toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--g);color:#04130d;padding:8px 16px;border-radius:8px;font-weight:600;display:none;z-index:9}
.lp{max-width:1080px;margin:0 auto;padding:0 20px}.lp nav{display:flex;align-items:center;justify-content:space-between;padding:18px 0;gap:10px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;align-items:center;padding:48px 0 56px}
.hero h1{font-size:clamp(34px,5vw,56px);line-height:1.05}.hero p{color:var(--m);font-size:17px;max-width:480px}
.lp section{padding:34px 0}.lp h2{font-size:28px;margin-bottom:18px}
@media(max-width:860px){.two,.eq,.hero{grid-template-columns:1fr}aside{width:62px}.lb{display:none}.logo span{display:none}main{padding:18px 12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style><style id="fp-motion">html{scroll-behavior:smooth}
/* logo */
.logo{font-size:22px;gap:12px;cursor:pointer}
.mk{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#5b9bff,#2563eb);box-shadow:0 0 14px #3b82f655;transition:transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .3s,filter .3s}
.mk svg.i{width:22px;height:22px;color:#fff}
.logo span{transition:color .3s,text-shadow .3s}
aside{overflow:visible;z-index:5}
.c aside{width:76px}.c .logo{padding-left:0;padding-right:0;justify-content:center}.c .logo span{display:none}
@media(max-width:860px){aside{width:76px}.logo:not(.lp .logo){padding-left:0;padding-right:0;justify-content:center}}
@keyframes glow{to{box-shadow:0 0 0 7px #3b82f622,0 0 40px 14px #60a5fa88}}
@keyframes zap{30%{transform:scale(1.3) rotate(10deg)}60%{transform:scale(.92)}}
/* buttons, inputs, rows */
.btn{position:relative;overflow:hidden;transition:transform .2s,box-shadow .25s,border-color .2s,filter .2s}
.btn:active{transform:translateY(0) scale(.97)}.btn:disabled{cursor:not-allowed;opacity:.55}
.rp{position:absolute;border-radius:50%;background:#ffffff38;transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
input,select,textarea{transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--b);box-shadow:0 0 0 3px #3b82f633}
aside a svg.i,.tg svg.i{transition:transform .2s,color .2s}
td{transition:background .15s}
.chip{transition:transform .2s}
.card{position:relative}
.lp .grid>.card,.kpi,.hero .card{transition:transform .25s,border-color .25s,box-shadow .25s}
.lp .grid>.card::before,.kpi::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(220px circle at var(--mx,50%) var(--my,50%),#3b82f624,transparent 70%)}
.hero .card{animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px)}}
/* hover (mouse devices only) */
@media(hover:hover){
.logo:hover .mk{transform:scale(1.22) rotate(-6deg);filter:brightness(1.3);box-shadow:0 0 0 4px #3b82f638,0 0 28px 8px #3b82f6cc;animation:glow 1.4s ease-in-out infinite alternate}
.logo:hover .mk svg{animation:zap .6s ease}
.logo:hover span{color:#fff;text-shadow:0 0 16px #60a5fa}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px #00000066}
.btn.p:hover{box-shadow:0 8px 26px #3b82f688;filter:brightness(1.12)}
.lp .grid>.card:hover,.kpi:hover,.hero .card:hover{transform:translateY(-4px);border-color:#3b82f688;box-shadow:0 14px 34px #00000066}
.lp .grid>.card:hover::before,.kpi:hover::before{opacity:1}
.lp .grid>.card:hover h3{color:#8ab8ff}
.hero .card:hover{animation:none}
aside a:hover svg.i,.tg:hover svg.i{transform:translateX(2px) scale(1.15);color:var(--b)}
tr:hover td{background:#3b82f60d}
.chip:hover{transform:translateY(-1px)}
input:hover,select:hover,textarea:hover{border-color:#3a475c}
}
/* entrance animations, only on page change */
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes sweep{from{stroke-dasharray:0 157}}
.enter{animation:rise .4s ease both}
.enter .grid>*{animation:rise .5s ease both}
.enter .grid>*:nth-child(2){animation-delay:.06s}.enter .grid>*:nth-child(3){animation-delay:.12s}.enter .grid>*:nth-child(4){animation-delay:.18s}.enter .grid>*:nth-child(5){animation-delay:.24s}.enter .grid>*:nth-child(n+6){animation-delay:.3s}
.enter .bar i{transform-origin:left;animation:grow .8s ease-out both}
.enter svg path[stroke-dasharray]{animation:sweep 1s ease-out}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style><style id="fp-hero-carousel-css">
/* Landing-page rotating vehicle investment examples */
.lp .hero .fp-hero-carousel{

.fp-hero-controls{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid #253143;padding-top:10px;min-height:51px}
.fp-hero-hint{font-size:11px;color:#8699b2;line-height:1.3}
.fp-hero-buttons{display:flex;align-items:center;gap:8px;flex-shrink:0}
.fp-hero-arrow{height:32px;width:35px;display:grid;place-items:center;border-radius:9px;border:1px solid #34445b;background:#1b2736;color:#e8effa;font:600 23px/1 'Inter Tight',sans-serif;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
.fp-hero-arrow:hover{background:#213b60;border-color:#5594e6;transform:translateY(-1px)}

.fp-hero-progress{height:2px;background:#243345;margin-top:10px;border-radius:10px;overflow:hidden}
.fp-hero-progress-fill{height:100%;background:#4e9afa;width:0;transform-origin:left}
.fp-hero-progress-fill.running{animation:fpHeroTimer 6.8s linear forwards}
@keyframes fpHeroTimer{from{width:0}to{width:100%}}
@media(max-width:580px){
 .lp .hero .fp-hero-carousel{padding:15px}
 .fp-hero-slide{min-height:258px}
 .fp-hero-name-row h3{font-size:14px}
 .fp-hero-profit-row .big{font-size:26px}
 .fp-hero-hint{font-size:10px;max-width:55%}
}
@media(prefers-reduced-motion:reduce){
 .fp-hero-slide,.fp-hero-arrow{transition:none!important}
 .fp-hero-progress-fill.running{animation:none!important}
}
.fp-hero-vehicle-visual{margin:10px 0 12px;border:1px solid #2d3f55;border-radius:12px;background:radial-gradient(circle at 50% 20%,rgba(76,144,255,.18),rgba(12,18,27,0) 45%),linear-gradient(180deg,#132133 0%,#0f1825 100%);padding:12px 12px 10px;display:flex;align-items:center;justify-content:center;min-height:136px;box-shadow:inset 0 1px 0 rgba(255,255,255,.02)}
.fp-hero-vehicle-visual img{display:block;max-width:100%;max-height:112px;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.42))}
.fp-hero-vehicle-badge{position:absolute;right:12px;bottom:10px;font:600 10px/1 'Inter Tight',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#6f8bad;background:rgba(8,13,21,.55);border:1px solid rgba(76,144,255,.18);padding:4px 7px;border-radius:999px}
.fp-hero-vehicle-wrap{position:relative}
@media(max-width:580px){.fp-hero-vehicle-visual{min-height:112px;padding:10px 8px}.fp-hero-vehicle-visual img{max-height:88px}.fp-hero-vehicle-badge{font-size:9px;right:9px;bottom:8px}}

</style><style id="fp-electric-hive">

 return `<div class="fp-hero-name-row"><h3>${v.make} ${v.model}, ${v.year}</h3><span class="fp-hero-status ${status[1]}">${status[0]}</span></div>
 <span class="fp-hero-route">Buy in ${({DE:'Germany',AT:'Austria',NL:'Netherlands',BE:'Belgium',PL:'Poland'})[v.country]||v.country} · Sell in Czechia · ${v.km.toLocaleString('en-US')} km</span>
 ${vehicleVisual}
 <div class="row"><span>Purchase</span><b>${f(v.price)}</b></div>
 <div class="row"><span>Costs on top</span><b>${f(cost)}</b></div>
 <div class="row"><span>Expected resale</span><b>${f(e.resale)}</b></div>
 <div class="fp-hero-profit-row"><div><span class="mu">Projected net ${n>=0?'profit':'loss'}</span><div class="big ${n>=0?'cg':'cr'}">${f(n)}</div></div>${gauge(c.score)}</div>`;
}
function updateCard(){
 const root=getRoot();if(!root)return;
 root.querySelector('#fp-hero-slide').innerHTML=content(EXAMPLES[index]);
 root.querySelector('#fp-hero-counter').textContent=`${index+1} / ${EXAMPLES.length}`;
}
function setProgress(on){
 const bar=getRoot()?.querySelector('#fp-hero-progress-fill');if(!bar)return;
 bar.classList.remove('running');bar.style.animation='none';
 if(on){void bar.offsetWidth;bar.style.animation='';bar.classList.add('running');}
}
function shouldRotate(){
 const root=getRoot();
 return root&&root===activeRoot&&!reduced.matches&&!document.hidden&&!root.matches(':hover')&&!root.matches(':focus-within');
}
function schedule(){
 clearTimeout(timer);timer=null;setProgress(false);
 if(!shouldRotate())return;
 setProgress(true);
 timer=setTimeout(()=>change(1),INTERVAL);
}
function change(dir){
 const root=getRoot(),slide=root?.querySelector('#fp-hero-slide');
 if(!root||!slide||busy||root!==activeRoot)return;
 busy=true;clearTimeout(timer);timer=null;setProgress(false);
 if(reduced.matches){index=(index+dir+EXAMPLES.length)%EXAMPLES.length;updateCard();busy=false;schedule();return;}
 slide.dataset.phase=dir>0?'out-next':'out-prev';
 swapTimer=setTimeout(()=>{
  if(root!==getRoot()){clearAll();return;}
  index=(index+dir+EXAMPLES.length)%EXAMPLES.length;
  updateCard();
  slide.dataset.phase=dir>0?'in-next':'in-prev';
  // Apply the entry state before restarting transitions.
  void slide.offsetWidth;
  requestAnimationFrame(()=>{
   if(root!==getRoot())return;
   delete slide.dataset.phase;
   finishTimer=setTimeout(()=>{busy=false;schedule();},290);
  });
 },260);
}
function init(){
 const root=getRoot();
 if(!root){clearAll();return;}
 if(root===activeRoot)return;
 clearAll();activeRoot=root;index=0;updateCard();
 root.addEventListener('click',e=>{const b=e.target.closest('button[data-step]');if(b&&root.contains(b)){change(Number(b.dataset.step));if(e.detail>0)b.blur();}});
 root.addEventListener('mouseenter',()=>{clearTimeout(timer);timer=null;setProgress(false);});
 root.addEventListener('mouseleave',()=>schedule());
 root.addEventListener('focusin',()=>{clearTimeout(timer);timer=null;setProgress(false);});
 root.addEventListener('focusout',()=>setTimeout(schedule,0));
 root.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();change(e.key==='ArrowRight'?1:-1);}});
 schedule();
}
window.addEventListener('hashchange',()=>setTimeout(init,0));
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(timer);timer=null;setProgress(false)}else{schedule();}});
reduced.addEventListener?.('change',schedule);
init();
})();</script></body></html>
